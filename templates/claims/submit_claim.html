{% extends "dashboard/base.html" %}
{% block title %}Submit Claim | HealthInsure{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow space-y-6 mt-8">

  <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-4">🧾 Submit Claim</h2>

  <!-- Messages -->
  {% if messages %}
    {% for message in messages %}
      <div class="px-4 py-2 rounded {{ message.tags|default:'bg-gray-100 text-gray-800' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="post" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}

    <!-- Client -->
    <div>
      <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">Client</label>
      <select name="client" required class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500">
        <option value="">-- Select Client --</option>
        {% for client in clients %}
          <option value="{{ client.id }}">{{ client.full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Policy -->
    <div>
      <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">Policy</label>
      <select name="policy" required class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500">
        <option value="">-- Select Policy --</option>
        {% for policy in policies %}
          <option value="{{ policy.id }}">{{ policy.policy_number }} ({{ policy.get_policy_type_display }})</option>
        {% endfor %}
      </select>
    </div>

    <!-- Amount -->
    <div>
      <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">Amount ($)</label>
      <input type="number" name="amount" step="0.01" min="0" required
             class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500"
             placeholder="Enter claim amount">
    </div>

    <!-- Notes -->
    <div>
      <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">Notes (Optional)</label>
      <textarea name="notes" rows="3" class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Add any notes or description for the claim"></textarea>
    </div>

    <!-- Document Upload -->
    <div>
      <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-1">Upload Document (Optional)</label>
      <input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png"
             class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500">
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Attach supporting documents for the claim.</p>
    </div>

    <!-- Submit -->
    <div class="flex justify-end">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">
        💾 Submit Claim
      </button>
    </div>

  </form>
</div>
{% endblock %}
