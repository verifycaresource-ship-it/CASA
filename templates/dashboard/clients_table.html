<div class="glass shadow-xl rounded-2xl p-6 mb-6 relative overflow-hidden">
  <h3 class="text-xl font-semibold text-white mb-4">👥 Clients</h3>

  <div class="overflow-x-auto">
    <table id="clients-table" class="min-w-full table-auto text-white">
      <thead class="bg-cyan-500/30 text-white backdrop-blur-md rounded-t-lg">
        <tr>
          <th class="px-4 py-2 text-left">First Name</th>
          <th class="px-4 py-2 text-left">Last Name</th>
          <th class="px-4 py-2 text-left">Email</th>
          <th class="px-4 py-2 text-left">Phone</th>
          <th class="px-4 py-2 text-left">Verified</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-white/10">
        {% for client in clients %}
        <tr class="hover:bg-cyan-500/20 transition-colors">
          <td class="px-4 py-2">{{ client.first_name }}</td>
          <td class="px-4 py-2">{{ client.last_name }}</td>
          <td class="px-4 py-2">{{ client.email }}</td>
          <td class="px-4 py-2">{{ client.phone }}</td>
          <td class="px-4 py-2">{{ client.verified }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- Neon blob background -->
  <div class="absolute -top-10 -right-10 w-32 h-32 bg-gradient-to-tr from-purple-500 to-pink-500 opacity-20 rounded-full blur-3xl animate-blob"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    $('#clients-table').DataTable({
      responsive: true,
      pagingType: 'simple_numbers',
      language: {
        search: "_INPUT_",
        searchPlaceholder: "Search clients..."
      }
    });
});
</script>
