{% load static %}

<!-- Sidebar -->
<aside class="w-64 bg-white dark:bg-zinc-900 h-screen shadow-lg flex flex-col fixed transition-all duration-300">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-200 dark:border-zinc-700">
    <h2 class="text-2xl font-bold text-blue-600">
      Health<span class="text-gray-800 dark:text-gray-100">Care</span>
    </h2>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-2 overflow-y-auto sidebar-scroll">

    {% if user.role == 'hospital' %}
      <a href="{% url 'hospitals:dashboard' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if request.resolver_match.url_name == 'dashboard' %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        🏥 Dashboard
      </a>
      <a href="{% url 'hospitals:assigned_clients' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if request.resolver_match.url_name == 'assigned_clients' %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        📋 Assigned Clients
      </a>
      <a href="{% url 'claims:hospital_claim_dashboard' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if request.resolver_match.url_name == 'hospital_claim_dashboard' %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        💰 My Claims
      </a>
      <a href="{% url 'hospitals:submit_claim' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg bg-green-500 text-white hover:bg-green-600 transition">
        ➕ Submit Claim
      </a>

    {% elif user.role == 'agent' %}
      <a href="{% url 'accounts:agent_dashboard' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if request.resolver_match.url_name == 'agent_dashboard' %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        👤 Dashboard
      </a>
      <a href="{% url 'clients:client_list' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if '/clients/' in request.path %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        👥 Clients
      </a>
      <a href="{% url 'clients:add_client' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg bg-green-500 text-white hover:bg-green-600 transition">
        ➕ Register Client
      </a>

    {% else %}
      <!-- Admin / Superuser -->
      <a href="{% url 'accounts:dashboard' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if request.resolver_match.url_name == 'dashboard' %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        🏠 Dashboard
      </a>
      <a href="{% url 'clients:client_list' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if '/clients/' in request.path %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        👥 Clients
      </a>
      <a href="{% url 'policies:policy_list' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if '/policies/' in request.path %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        📄 Policies
      </a>
      <a href="{% url 'claims:claim_list' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if '/claims/' in request.path %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        💰 Claims
      </a>
      <a href="{% url 'hospitals:hospital_list' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if '/hospitals/' in request.path %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        🏥 Hospitals
      </a>
      <a href="{% url 'accounts:user_list' %}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 {% if '/accounts/users/' in request.path %}bg-gray-200 dark:bg-zinc-700{% endif %}">
        👤 Users
      </a>
    {% endif %}

  </nav>

  <!-- Logout -->
  <div class="p-4 border-t border-gray-200 dark:border-zinc-700 mt-auto">
    <a href="{% url 'accounts:logout' %}" 
       class="block text-center bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-lg transition">
      Logout
    </a>
  </div>
</aside>

<!-- Mobile toggle (optional) -->
<div class="md:hidden fixed top-4 left-4 z-50">
  <button id="sidebar-toggle" class="p-2 bg-blue-600 text-white rounded-lg shadow-lg hover:bg-blue-700 transition">
    ☰
  </button>
</div>

<script>
  const sidebar = document.querySelector('aside');
  const toggleBtn = document.getElementById('sidebar-toggle');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('-translate-x-64');
  });
</script>

<style>
  aside {
    transition: transform 0.3s ease-in-out;
  }

  @media (max-width: 768px) {
    aside {
      transform: translateX(-16rem);
      position: fixed;
      z-index: 40;
    }
  }

  .sidebar-scroll {
    scrollbar-width: thin;
    scrollbar-color: rgba(107, 114, 128, 0.5) transparent;
  }

  .sidebar-scroll::-webkit-scrollbar {
    width: 6px;
  }

  .sidebar-scroll::-webkit-scrollbar-thumb {
    background-color: rgba(107, 114, 128, 0.5);
    border-radius: 3px;
  }
</style>
