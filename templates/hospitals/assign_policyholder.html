{% extends "dashboard/base.html" %}
{% load static %}
{% block title %}Assign Policyholder | HealthInsure{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-xl shadow space-y-4">
  <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100 mb-4">📋 Assign Policyholder</h2>

  <!-- ✅ Message Alerts -->
  {% if messages %}
    <div class="space-y-2">
      {% for message in messages %}
        <div
          class="p-3 rounded text-sm
          {% if message.tags == 'success' %}
            bg-green-100 text-green-800 border border-green-300
          {% elif message.tags == 'error' %}
            bg-red-100 text-red-800 border border-red-300
          {% elif message.tags == 'warning' %}
            bg-yellow-100 text-yellow-800 border border-yellow-300
          {% else %}
            bg-blue-100 text-blue-800 border border-blue-300
          {% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
  <!-- ✅ End Message Alerts -->

  <form method="post" class="space-y-4">
    {% csrf_token %}

    <div>
      <label class="block mb-1 font-medium text-gray-700 dark:text-gray-200">Policyholder & Policy</label>
      <select name="policy" class="w-full border rounded p-2 dark:bg-gray-700 dark:text-gray-200">
        <option value="">-- Select Policyholder --</option>
        {% for policy in policies %}
          <option value="{{ policy.id }}">
            {{ policy.client.first_name }} {{ policy.client.last_name }} |
            {{ policy.policy_number }} |
            Premium: {{ policy.premium }} |
            Start: {{ policy.start_date|date:"M. d, Y" }} |
            Expiry: {{ policy.expiry_date|date:"M. d, Y" }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block mb-1 font-medium text-gray-700 dark:text-gray-200">Hospital</label>
      <select name="hospital" class="w-full border rounded p-2 dark:bg-gray-700 dark:text-gray-200">
        <option value="">-- Select Hospital --</option>
        {% for hospital in hospitals %}
          <option value="{{ hospital.id }}">{{ hospital.name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
      Assign Policyholder
    </button>
  </form>
</div>
{% endblock %}
