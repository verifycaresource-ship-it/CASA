{% extends "dashboard/base.html" %}
{% block title %}{{ form.instance.pk|yesno:"Edit Task,Create Task" }} | HealthInsure{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow p-6">
    <h1 class="text-2xl font-bold mb-6">{{ form.instance.pk|yesno:"Edit Task,Create Task" }}</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow">Save Task</button>
        <a href="{% url 'tasks:task_list' %}" class="text-gray-600 hover:text-gray-900 ml-4">Cancel</a>
    </form>
</div>
{% endblock %}
