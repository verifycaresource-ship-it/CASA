{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Password Reset | HealthInsure Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="//unpkg.com/alpinejs" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin:0;
      min-height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0f172a;
      position:relative;
      padding:1rem;
    }

    /* === Neon Flux Blobs === */
    .blob {
      position:absolute;
      border-radius:50%;
      filter:blur(140px);
      opacity:0.5;
      animation: blobMove 25s infinite alternate;
      z-index:0;
    }
    .blob1 { width:350px;height:350px;background:#3b82f6;top:-80px;left:-80px;box-shadow:0 0 80px #3b82f6; animation-delay:0s;}
    .blob2 { width:400px;height:400px;background:#06b6d4;bottom:-100px;right:-100px;box-shadow:0 0 100px #06b6d4; animation-delay:7s;}
    .blob3 { width:300px;height:300px;background:#9333ea;top:150px;left:50%;box-shadow:0 0 100px #9333ea; animation-delay:14s;}

    @keyframes blobMove {
      0%,100%{transform:translate(0,0) scale(1);}
      25%{transform:translate(40px,-30px) scale(1.1);}
      50%{transform:translate(-30px,40px) scale(0.9);}
      75%{transform:translate(30px,-40px) scale(1.05);}
    }

    /* Stars */
    .star {
      position:absolute; width:2px;height:2px; background:white;
      border-radius:50%; opacity:0.5; animation: twinkle 3s infinite alternate;
    }
    @keyframes twinkle {0%{opacity:0.2;}50%{opacity:0.8;}100%{opacity:0.2;}}

    /* Glass Card */
    .glass {
      position:relative;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(35px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:2rem;
      color:#E0F2FE;
      box-shadow:0 0 40px #3b82f6,0 0 80px #9333ea;
      border-image: linear-gradient(45deg,#3B82F6,#06B6D4,#9333EA) 1;
      animation:fadeInUp 1s ease-out forwards;
      opacity:0;
      transform:translateY(30px);
      padding:3rem 2rem;
      width:100%;
      max-width:450px;
      text-align:center;
    }

    @keyframes fadeInUp { to{opacity:1;transform:translateY(0);} }

    input {
      background: rgba(255,255,255,0.05);
      color: #E0F2FE;
      border:1px solid rgba(56,189,248,0.5);
      box-shadow:0 0 10px rgba(56,189,248,0.2);
    }
    input::placeholder { color:#A5B4FC; }
    input:focus {
      background: rgba(255,255,255,0.12);
      outline:none;
      border-color:#38BDF8;
      box-shadow:0 0 10px #3B82F6,0 0 20px #06B6D4;
    }

    .btn-gradient {
      background: linear-gradient(90deg,#3B82F6,#06B6D4,#9333EA);
      color:white;
      font-weight:600;
      font-size:1.125rem;
      padding:0.75rem 1rem;
      border-radius:1rem;
      transition: all 0.3s ease;
      box-shadow:0 5px 20px rgba(147,51,234,0.4);
    }
    .btn-gradient:hover {
      transform:scale(1.05);
      opacity:0.95;
      box-shadow:0 10px 40px rgba(147,51,234,0.6),0 0 20px #06b6d4;
    }

    .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-5px);} to{opacity:1;transform:translateY(0);} }

    /* === Fully Responsive Styles === */
    @media (max-width:1024px){
      .glass { max-width:400px; padding:2.5rem 1.8rem; }
      .blob1,.blob2,.blob3 { filter:blur(120px); }
    }

    @media (max-width:768px){
      .glass { max-width:90%; padding:2rem 1.5rem; }
      h1 { font-size:1.75rem; }
    }

    @media (max-width:480px){
      .glass { padding:1.5rem 1rem; }
      h1 { font-size:1.5rem; }
      input { font-size:0.9rem; }
      .btn-gradient { font-size:1rem; padding:0.5rem 0.75rem; }
      .blob1,.blob2,.blob3 { width:250px;height:250px; }
    }

    @media (max-width:360px){
      .glass { padding:1.2rem 0.8rem; }
      h1 { font-size:1.35rem; }
      .btn-gradient { font-size:0.95rem; padding:0.45rem 0.7rem; }
    }

  </style>
</head>

<body>
  <!-- Flux Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <!-- Stars -->
  <div class="star" style="top:5%; left:10%;"></div>
  <div class="star" style="top:20%; left:80%;"></div>
  <div class="star" style="top:70%; left:50%;"></div>
  <div class="star" style="top:90%; left:30%;"></div>

  <!-- Glass Card -->
  <div class="glass mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold mb-6">Request Password Reset</h1>

    {% if messages %}
      <div class="space-y-2 mb-4">
        {% for message in messages %}
          <div class="p-2 text-sm rounded bg-red-500 text-white animate-fade-in">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Enter your registered email" required class="w-full px-4 py-2 rounded-xl text-cyan-100 placeholder-cyan-300 border border-white/20 focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition">
      <button type="submit" class="btn-gradient w-full">Send OTP</button>
    </form>

    <p class="mt-4 text-sm text-cyan-200 text-center">
      Remembered your password?
      <a href="{% url 'accounts:login' %}" class="text-cyan-300 hover:text-cyan-100 underline font-medium">Login here</a>
    </p>
  </div>

  <script src="//unpkg.com/alpinejs" defer></script>
  <script>lucide.createIcons();</script>
</body>
</html>
